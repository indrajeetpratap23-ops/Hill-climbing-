'use strict';
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W=1,H=1,DPR=1,U=1,S=30;

// terrain: seeded smooth noise, hills get steeper with distance
let seed=1;
const hs=i=>{const s=Math.sin(i*127.1+seed*311.7)*43758.5453;return(s-Math.floor(s))*2-1};
const sn=x=>{const i=Math.floor(x),t=(1-Math.cos((x-i)*Math.PI))/2;return hs(i)*(1-t)+hs(i+1)*t};
const T=x=>{const b=Math.min(1,Math.max(0,(x-14)/30)),g=1+Math.min(x,3000)/3000*.7;return b*b*g*(3.6*sn(x/30)+1.3*sn(x/12+100)+.35*sn(x/4.5+200))};

const gap=(x,y)=>y-T(x)-WR*Math.hypot(1,sl(x));
// car physics (mass 1, spring wheels, motor traction)

let WA=[[-1.1,-.15],[1.1,-.15]],BPS=[];const BP=[[-1.7,-.5],[1.7,-.5],[0,-.5],[-1.6,.55],[1.6,.55],[.1,1.05]];const VEH=[{n:'Jeep',c:0,g:0,eng:4.5,ks:24,cd:3,mu:1.1,wr:.42,vm:26,fuel:100,mi:1.4,wa:[[-1.1,-.15],[1.1,-.15]],L:3.6,h:.95,col:'#e0442f'},{n:'Bike',c:1000,g:0,eng:3.8,ks:20,cd:2.6,mu:1,wr:.38,vm:24,fuel:70,mi:1,wa:[[-.85,-.15],[.85,-.15]],L:2.6,h:.7,col:'#2c6bd6'},{n:'Monster',c:4000,g:3,eng:5.6,ks:22,cd:2.4,mu:1.25,wr:.75,vm:24,fuel:130,mi:2,wa:[[-1.3,-.15],[1.3,-.15]],L:3.8,h:1,col:'#3aa655'},{n:'Rally',c:8000,g:8,eng:5.4,ks:30,cd:3.6,mu:1.3,wr:.4,vm:32,fuel:90,mi:1.2,wa:[[-1.2,-.15],[1.2,-.15]],L:3.8,h:.75,col:'#ff8a1f'}];const UP=['Engine','Suspension','Tires','Fuel tank'],upCost=l=>100*(1<<l);function apply(){V=VEH[sv.sel];const u=sv.up[sv.sel];ENG=V.eng*(1+.12*u[0]);VMAX=V.vm*(1+.03*u[0]);KS=V.ks*(1+.05*u[1]);CD=V.cd*(1+.1*u[1]);MU=V.mu*(1+.08*u[2]);WR=V.wr;MI=V.mi;WA=V.wa;FM=V.fuel*(1+.2*u[3]);BPS=BP.map(p=>[p[0]*V.L/3.6,p[1]])}
let car,fuel=100,coins=0,dist=0,flips=0,gmRun=0,msg='',msgT=0,btns=[],state='menu',tmr=0,over='',pop=[],parts=[],got=new Set(),camX=0,camY=0,zoom=1,gas=0,brk=0,airT=0,rot=0,noF=0,nHit=0,nTouch=0,crashF=0,fsTried=0;

let AC,eo,eg;
function reset(){apply();seed=Math.random()*1000;car={x:2,y:T(2)+WR+.7,a:0,vx:0,vy:0,w:0,ws:[{p:.4,r:0},{p:.4,r:0}]};fuel=FM;coins=0;dist=0;flips=0;pop=[];parts=[];got=new Set();airT=0;rot=0;noF=0;tmr=0;for(let i=0;i<100;i++)step(DT);car.vx=car.vy=car.w=0;camX=car.x;camY=car.y;zoom=1}
function step(dt){
 const c=car,ca=Math.cos(c.a),sa=Math.sin(c.a),pl=state==='play',gs=pl&&gas&&fuel>0,bk=pl&&brk;
 let ax=0,ay=-G,al=0;nHit=0;nTouch=0;crashF=0;
 for(let i=0;i<2;i++){
  const wh=c.ws[i],lx=WA[i][0],ly=WA[i][1],px=c.x+lx*ca-ly*sa,py=c.y+lx*sa+ly*ca,dx=sa,dy=-ca;

  if(gap(px+dx*SM,py+dy*SM)<=0){hit=1;if(gap(px,py)<=0)s=0;else{let lo=0,hi=SM;for(let k=0;k<10;k++){const m=(lo+hi)/2;if(gap(px+dx*m,py+dy*m)>0)lo=m;else hi=m}s=lo}}

function draw(fd){
